name: Test saving an update plan with preview and applying it with up
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: test-passphrase
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PULUMI_EXPERIMENTAL: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pulumi YAML project
        run: |
          mkdir -p "$RUNNER_TEMP/plan-state" "$RUNNER_TEMP/plan-proj"
          cat > "$RUNNER_TEMP/plan-proj/Pulumi.yaml" <<'EOF'
          name: act-plan-test
          runtime: yaml
          outputs:
            greeting: hello-plan
          EOF
      - id: preview
        uses: .
        with:
          command: preview
          stack-name: dev
          upsert: "true"
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/plan-proj
          cloud-url: file://${{ runner.temp }}/plan-state
          plan: ${{ runner.temp }}/update-plan.json
      - name: Assert plan file was saved
        run: |
          if [ ! -s "$RUNNER_TEMP/update-plan.json" ]; then
            echo "FAIL: plan file not written"
            exit 1
          fi
          head -c 500 "$RUNNER_TEMP/update-plan.json"; echo
          echo "PASS"
      - id: action
        uses: .
        with:
          command: up
          stack-name: dev
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/plan-proj
          cloud-url: file://${{ runner.temp }}/plan-state
          plan: ${{ runner.temp }}/update-plan.json
          suppress-progress: "true"
      - name: Assert up with plan produced stack output
        env:
          ACTUAL: ${{ steps.action.outputs.greeting }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello-plan" ]; then
            echo "FAIL: expected 'hello-plan'"
            exit 1
          fi
          echo "PASS"
