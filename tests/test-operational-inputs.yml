name: Test operational inputs (message, parallel, log-verbosity, config-map)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: "test-passphrase"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Pulumi program
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pulumi-op-inputs"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pulumi-op-inputs/Pulumi.yaml" << 'EOF'
          name: test-op-inputs
          runtime: yaml
          description: A minimal Pulumi YAML program for testing operational inputs
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pulumi-op-inputs/Pulumi.test-stack.yaml" << 'EOF'
          config:
            pulumi:tags:
              value:
                pulumi:template: ""
          EOF

      - name: Run action with operational inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: test-stack
          work-dir: tests/fixtures/pulumi-op-inputs
          cloud-url: file://${{ github.workspace }}/tests/fixtures/pulumi-op-state
          pulumi-version: 3.x
          upsert: 'true'
          message: 'Test update message'
          parallel: '4'
          log-verbosity: '1'
          config-map: '{"test:key":{"value":"test-value","secret":false}}'

      - name: Assert action ran with operational inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: preview command succeeded with operational inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
