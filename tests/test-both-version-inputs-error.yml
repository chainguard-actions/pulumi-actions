name: Test error when both pulumi-version and pulumi-version-file are provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create version file
        run: |
          echo "3.100.0" > "$GITHUB_WORKSPACE/.pulumi.version"

      - name: Run action with both version inputs (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          pulumi-version: 3.100.0
          pulumi-version-file: .pulumi.version

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when both pulumi-version and pulumi-version-file were provided"
          else
            echo "FAIL: expected action to fail but got outcome '$OUTCOME'"
            exit 1
          fi
