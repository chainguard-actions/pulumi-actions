name: Test PR comment and logging inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: preview
          stack-name: dev
          pulumi-version: 3.140.0
          cloud-url: file://~
          comment-on-pr: 'false'
          comment-on-pr-number: '42'
          comment-on-summary: 'false'
          log-verbosity: '3'
          log-flow: 'false'
          debug: 'false'
          suppress-outputs: 'true'
          suppress-progress: 'true'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may fail due to no Pulumi project, but inputs were accepted)"
          echo "PASS"
