name: Test up with local file backend and upsert
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: test-passphrase
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pulumi YAML project and local state dir
        run: |
          mkdir -p "$RUNNER_TEMP/pulumi-state" "$RUNNER_TEMP/pulumi-up-proj"
          cat > "$RUNNER_TEMP/pulumi-up-proj/Pulumi.yaml" <<'EOF'
          name: act-up-test
          runtime: yaml
          outputs:
            greeting: hello-world
          EOF
          cat "$RUNNER_TEMP/pulumi-up-proj/Pulumi.yaml"
      - id: action
        uses: .
        with:
          command: up
          stack-name: dev
          upsert: "true"
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/pulumi-up-proj
          cloud-url: file://${{ runner.temp }}/pulumi-state
          suppress-progress: "true"
      - name: Assert stack output exported as step output
        env:
          ACTUAL: ${{ steps.action.outputs.greeting }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello-world" ]; then
            echo "FAIL: expected 'hello-world'"
            exit 1
          fi
          echo "PASS"
      - name: Assert command output captured
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "greeting"; then
            echo "FAIL: expected output to mention 'greeting'"
            exit 1
          fi
          echo "PASS"
