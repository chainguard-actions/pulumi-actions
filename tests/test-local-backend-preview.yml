name: Test preview with local backend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local state directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pulumi-state"

      - id: action
        name: Run Pulumi preview with local file backend
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: dev
          pulumi-version: '^3'
          work-dir: tests/fixtures/pulumi-project
          cloud-url: file://${{ github.workspace }}/tests/fixtures/pulumi-state
          upsert: 'true'

      - name: Assert preview ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: preview succeeded with local backend"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
