name: Test secrets-provider input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local state directory
        run: mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/pulumi-state-sp"

      - id: action
        name: Run Pulumi preview with passphrase secrets-provider
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: dev
          pulumi-version: '^3'
          work-dir: hardened/tests/fixtures/pulumi-project
          cloud-url: file://${{ github.workspace }}/hardened/tests/fixtures/pulumi-state-sp
          upsert: 'true'
          secrets-provider: 'passphrase'
        env:
          PULUMI_CONFIG_PASSPHRASE: 'test-passphrase-123'

      - name: Assert action ran with secrets-provider input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with secrets-provider input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
