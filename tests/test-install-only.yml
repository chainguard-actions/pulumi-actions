name: Test install-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in install-only mode
        id: action
        uses: .
        with:
          pulumi-version: '3.x'

      - name: Assert Pulumi CLI is installed
        run: |
          echo "Checking pulumi is available in PATH..."
          if ! command -v pulumi &>/dev/null; then
            echo "FAIL: pulumi CLI not found in PATH"
            exit 1
          fi
          VERSION=$(pulumi version)
          echo "Installed version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: pulumi version returned empty string"
            exit 1
          fi
          echo "PASS: pulumi CLI installed successfully: $VERSION"
