name: Test install-only mode (no command)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in install-only mode
        id: action
        uses: .
        with:
          pulumi-version: 3.x

      - name: Assert Pulumi CLI is installed
        run: |
          echo "Checking if pulumi is installed..."
          if ! command -v pulumi &>/dev/null; then
            echo "FAIL: pulumi CLI not found on PATH"
            exit 1
          fi
          VERSION=$(pulumi version 2>&1 || true)
          echo "pulumi version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: pulumi version returned empty"
            exit 1
          fi
          echo "PASS: Pulumi CLI is installed"
