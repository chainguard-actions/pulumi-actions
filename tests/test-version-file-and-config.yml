name: Test version file and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create pulumi version file
        run: echo "3.140.0" > .pulumi.version
      - id: action
        uses: .
        with:
          command: preview
          stack-name: dev
          pulumi-version-file: .pulumi.version
          cloud-url: file://~
          secrets-provider: passphrase
          parallel: '4'
          message: 'test update message'
          config-map: '{"myproject:key": {"value": "val", "secret": false}}'
          suppress-outputs: 'true'
          suppress-progress: 'true'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may fail due to no Pulumi project, but inputs were accepted)"
          echo "PASS"
