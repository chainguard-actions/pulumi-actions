name: Test error when pulumi-version-file does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent version file (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          pulumi-version-file: .nonexistent-version-file

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when pulumi-version-file does not exist"
          else
            echo "FAIL: expected action to fail but got outcome '$OUTCOME'"
            exit 1
          fi
