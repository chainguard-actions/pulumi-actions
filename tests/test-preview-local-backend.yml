name: Test preview with local file backend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: test-passphrase
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pulumi YAML project and local state dir
        run: |
          mkdir -p "$RUNNER_TEMP/pulumi-preview-state" "$RUNNER_TEMP/pulumi-preview-proj"
          cat > "$RUNNER_TEMP/pulumi-preview-proj/Pulumi.yaml" <<'EOF'
          name: act-preview-test
          runtime: yaml
          outputs:
            greeting: hello-preview
          EOF
      - id: action
        uses: .
        with:
          command: preview
          stack-name: dev
          upsert: "true"
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/pulumi-preview-proj
          cloud-url: file://${{ runner.temp }}/pulumi-preview-state
      - name: Assert preview output captured
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: preview output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qi "preview"; then
            echo "FAIL: expected preview output to mention 'preview'"
            exit 1
          fi
          echo "PASS"
      - name: Assert preview did not create stack outputs
        env:
          ACTUAL: ${{ steps.action.outputs.greeting }}
        run: |
          echo "actual: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: preview should not produce stack outputs, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
