name: Test resource targeting inputs (replace, exclude, target, secrets-provider)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: "test-passphrase"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Pulumi program
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pulumi-targeting"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pulumi-targeting/Pulumi.yaml" << 'EOF'
          name: test-targeting
          runtime: yaml
          description: A minimal Pulumi YAML program for testing resource targeting inputs
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pulumi-targeting/Pulumi.test-stack.yaml" << 'EOF'
          config:
            pulumi:tags:
              value:
                pulumi:template: ""
          EOF

      - name: Run action with resource targeting inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: test-stack
          work-dir: tests/fixtures/pulumi-targeting
          cloud-url: file://${{ github.workspace }}/tests/fixtures/pulumi-targeting-state
          pulumi-version: 3.x
          upsert: 'true'
          secrets-provider: passphrase
          replace: 'urn:pulumi:test-stack::test-targeting::pulumi:pulumi:Stack::test-targeting-test-stack'
          exclude: 'urn:pulumi:test-stack::test-targeting::pulumi:pulumi:Stack::test-targeting-test-stack'
          target: 'urn:pulumi:test-stack::test-targeting::pulumi:pulumi:Stack::test-targeting-test-stack'

      - name: Assert action ran with resource targeting inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: preview command succeeded with resource targeting inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
