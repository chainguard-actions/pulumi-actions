name: Test resource targeting inputs (replace, exclude, target, plan)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      PULUMI_CONFIG_PASSPHRASE: testpassphrase
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Pulumi CLI for project setup
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.100.0 2>/dev/null
          echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Create minimal Pulumi YAML project
        run: |
          mkdir -p /tmp/pulumi-target-project
          cat > /tmp/pulumi-target-project/Pulumi.yaml <<'EOF'
          name: target-test
          runtime: yaml
          description: Minimal YAML test project
          resources: {}
          EOF

      - name: Initialize local stack
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          cd /tmp/pulumi-target-project
          pulumi login --local
          pulumi stack init dev

      - id: action
        uses: .
        with:
          command: preview
          stack-name: dev
          work-dir: /tmp/pulumi-target-project
          cloud-url: file://~
          secrets-provider: passphrase
          pulumi-version: 3.100.0
          replace: "urn:pulumi:dev::target-test::pulumi:pulumi:Stack::target-test-dev"
          exclude: "urn:pulumi:dev::target-test::pulumi:pulumi:Stack::target-test-dev"
          target: "urn:pulumi:dev::target-test::pulumi:pulumi:Stack::target-test-dev"
          plan: /tmp/pulumi-plan.json
        env:
          PULUMI_CONFIG_PASSPHRASE: testpassphrase
        continue-on-error: true

      - name: Assert action ran with resource targeting inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "Action outcome: $OUTCOME"
          echo "Action output: $OUTPUT"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with replace/exclude/target/plan inputs (outcome=$OUTCOME)"
