name: Test pulumi-version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create pulumi version file
        run: echo "3.136.1" > .pulumi.version
      - id: action
        uses: .
        with:
          command: version
          pulumi-version-file: .pulumi.version
          cloud-url: file://~
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with pulumi-version-file input"
          echo "PASS"
