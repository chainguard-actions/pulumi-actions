name: Test preview with exclude URN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: test-passphrase
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pulumi YAML project
        run: |
          mkdir -p "$RUNNER_TEMP/exc-state" "$RUNNER_TEMP/exc-proj"
          cat > "$RUNNER_TEMP/exc-proj/Pulumi.yaml" <<'EOF'
          name: act-exclude-test
          runtime: yaml
          outputs:
            greeting: hello-exclude
          EOF
      - id: initial
        name: Initial up so the stack resource exists in state
        uses: .
        with:
          command: up
          stack-name: dev
          upsert: "true"
          pulumi-version: 3.170.0
          work-dir: ${{ runner.temp }}/exc-proj
          cloud-url: file://${{ runner.temp }}/exc-state
          suppress-progress: "true"
      - id: action
        uses: .
        with:
          command: preview
          stack-name: dev
          pulumi-version: 3.170.0
          work-dir: ${{ runner.temp }}/exc-proj
          cloud-url: file://${{ runner.temp }}/exc-state
          exclude: urn:pulumi:dev::act-exclude-test::pulumi:pulumi:Stack::act-exclude-test-dev
          exclude-dependents: "true"
      - name: Assert preview output captured
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: preview output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert existing stack outputs still exported
        env:
          ACTUAL: ${{ steps.action.outputs.greeting }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello-exclude" ]; then
            echo "FAIL: expected 'hello-exclude'"
            exit 1
          fi
          echo "PASS"
