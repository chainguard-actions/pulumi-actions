name: Test install specific Pulumi version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action to install specific Pulumi version
        id: action
        uses: .
        with:
          pulumi-version: 3.100.0

      - name: Assert specific Pulumi version is installed
        run: |
          echo "Checking if pulumi is installed..."
          if ! command -v pulumi &>/dev/null; then
            echo "FAIL: pulumi CLI not found on PATH"
            exit 1
          fi
          VERSION=$(pulumi version 2>&1 || true)
          echo "pulumi version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: pulumi version returned empty"
            exit 1
          fi
          # Check that the version contains 3.100.0
          if echo "$VERSION" | grep -q "3.100.0"; then
            echo "PASS: Pulumi CLI version 3.100.0 is installed"
          else
            echo "FAIL: Expected version 3.100.0, got: $VERSION"
            exit 1
          fi
