name: Test install specific Pulumi version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action to install specific Pulumi version
        id: action
        uses: .
        with:
          pulumi-version: '3.100.0'

      - name: Assert specific Pulumi version is installed
        run: |
          echo "Checking pulumi is available in PATH..."
          if ! command -v pulumi &>/dev/null; then
            echo "FAIL: pulumi CLI not found in PATH"
            exit 1
          fi
          VERSION=$(pulumi version)
          echo "Installed version: $VERSION"
          # Version should start with 'v' and contain '3.100.0'
          if [[ "$VERSION" != *"3.100.0"* ]]; then
            echo "FAIL: expected version 3.100.0, got: $VERSION"
            exit 1
          fi
          echo "PASS: pulumi CLI version 3.100.0 installed successfully"
