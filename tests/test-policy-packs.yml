name: Test policyPacks and policyPackConfigs inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local state directory
        run: mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/pulumi-state-pp"

      - id: action
        name: Run Pulumi preview with policyPacks and policyPackConfigs
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: dev
          pulumi-version: '^3'
          work-dir: hardened/tests/fixtures/pulumi-project
          cloud-url: file://${{ github.workspace }}/hardened/tests/fixtures/pulumi-state-pp
          upsert: 'true'
          policyPacks: 'my-policy-pack'
          policyPackConfigs: 'hardened/tests/fixtures/policy-pack-config.json'

      - name: Assert action ran with policyPacks/policyPackConfigs inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with policyPacks/policyPackConfigs inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
