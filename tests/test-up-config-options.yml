name: Test up with config-map and operation options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: test-passphrase
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pulumi YAML project that reads config
        run: |
          mkdir -p "$RUNNER_TEMP/cfg-state" "$RUNNER_TEMP/cfg-proj"
          cat > "$RUNNER_TEMP/cfg-proj/Pulumi.yaml" <<'EOF'
          name: act-config-test
          runtime: yaml
          config:
            greeting:
              type: string
          outputs:
            greeting: ${greeting}
          EOF
          cat "$RUNNER_TEMP/cfg-proj/Pulumi.yaml"
      - id: action
        uses: .
        with:
          command: up
          stack-name: dev
          upsert: "true"
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/cfg-proj
          cloud-url: file://${{ runner.temp }}/cfg-state
          secrets-provider: passphrase
          message: act harness config test
          parallel: "2"
          log-verbosity: "3"
          suppress-progress: "true"
          config-map: |
            {"act-config-test:greeting": {value: "from-config-map", secret: false}}
      - name: Assert config value flowed through to stack output
        env:
          ACTUAL: ${{ steps.action.outputs.greeting }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "from-config-map" ]; then
            echo "FAIL: expected 'from-config-map'"
            exit 1
          fi
          echo "PASS"
      - name: Assert config was persisted to stack config file
        run: |
          cat "$RUNNER_TEMP/cfg-proj/Pulumi.dev.yaml"
          if ! grep -q "from-config-map" "$RUNNER_TEMP/cfg-proj/Pulumi.dev.yaml"; then
            echo "FAIL: config value not written to Pulumi.dev.yaml"
            exit 1
          fi
          if ! grep -q "encryptionsalt" "$RUNNER_TEMP/cfg-proj/Pulumi.dev.yaml"; then
            echo "FAIL: expected passphrase secrets provider salt in Pulumi.dev.yaml"
            exit 1
          fi
          echo "PASS"
      - name: Assert command output captured
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          echo "PASS"
