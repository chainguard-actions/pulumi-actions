name: Test resource targeting inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: version
          pulumi-version: 3.136.1
          cloud-url: file://~
          replace: 'urn:pulumi:dev::myproject::aws:s3/bucket:Bucket::my-bucket'
          exclude: 'urn:pulumi:dev::myproject::aws:s3/bucket:Bucket::other-bucket'
          target: 'urn:pulumi:dev::myproject::aws:s3/bucket:Bucket::target-bucket'
          plan: /tmp/pulumi-plan.json
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with resource targeting inputs"
          echo "PASS"
