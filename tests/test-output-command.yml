name: Test output command reads stack outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: test-passphrase
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pulumi YAML project and local state dir
        run: |
          mkdir -p "$RUNNER_TEMP/pulumi-output-state" "$RUNNER_TEMP/pulumi-output-proj"
          cat > "$RUNNER_TEMP/pulumi-output-proj/Pulumi.yaml" <<'EOF'
          name: act-output-test
          runtime: yaml
          outputs:
            color: purple
          EOF
      - id: up
        uses: .
        with:
          command: up
          stack-name: dev
          upsert: "true"
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/pulumi-output-proj
          cloud-url: file://${{ runner.temp }}/pulumi-output-state
      - id: action
        uses: .
        with:
          command: output
          stack-name: dev
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/pulumi-output-proj
          cloud-url: file://${{ runner.temp }}/pulumi-output-state
      - name: Assert output command exported stack output
        env:
          ACTUAL: ${{ steps.action.outputs.color }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "purple" ]; then
            echo "FAIL: expected 'purple'"
            exit 1
          fi
          echo "PASS"
      - name: Assert output command produced empty command output
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: output command should set empty 'output'"
            exit 1
          fi
          echo "PASS"
