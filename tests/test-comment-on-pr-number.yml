name: Test comment-on-pr-number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: "test-passphrase"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Pulumi program
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pulumi-pr-comment"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pulumi-pr-comment/Pulumi.yaml" << 'EOF'
          name: test-pr-comment
          runtime: yaml
          description: A minimal Pulumi YAML program for testing PR comment inputs
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pulumi-pr-comment/Pulumi.test-stack.yaml" << 'EOF'
          config:
            pulumi:tags:
              value:
                pulumi:template: ""
          EOF

      - name: Run action with comment-on-pr-number input
        id: action
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: test-stack
          work-dir: tests/fixtures/pulumi-pr-comment
          cloud-url: file://${{ github.workspace }}/tests/fixtures/pulumi-pr-comment-state
          pulumi-version: 3.x
          upsert: 'true'
          comment-on-pr: 'true'
          comment-on-pr-number: '42'

      - name: Assert action ran with comment-on-pr-number input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: preview command succeeded with comment-on-pr-number input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected in test environment - sentinel repo cannot post PR comments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
