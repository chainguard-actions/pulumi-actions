name: Test comment-on-pr-number override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: test-passphrase
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pulumi YAML project
        run: |
          mkdir -p "$RUNNER_TEMP/pr-state" "$RUNNER_TEMP/pr-proj"
          cat > "$RUNNER_TEMP/pr-proj/Pulumi.yaml" <<'EOF'
          name: act-pr-test
          runtime: yaml
          outputs:
            greeting: hello-pr
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: dev
          upsert: "true"
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/pr-proj
          cloud-url: file://${{ runner.temp }}/pr-state
          comment-on-pr-number: "1"
          edit-pr-comment: "false"
      - name: Assert action ran (output set, or comment failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.output }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but the output is empty"
              exit 1
            fi
            echo "PASS: got preview output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
