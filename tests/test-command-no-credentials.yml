name: Test command without credentials fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Pulumi action with command but no credentials
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: dev
          pulumi-version: '^3'
          work-dir: ./
        env:
          PULUMI_ACCESS_TOKEN: ''

      - name: Assert action failed gracefully (no credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
