name: Test error when policy pack path does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: test-passphrase
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pulumi YAML project and policy config
        run: |
          mkdir -p "$RUNNER_TEMP/pp-state" "$RUNNER_TEMP/pp-proj"
          cat > "$RUNNER_TEMP/pp-proj/Pulumi.yaml" <<'EOF'
          name: act-policy-test
          runtime: yaml
          outputs:
            greeting: hello-policy
          EOF
          echo '{}' > "$RUNNER_TEMP/policy-config.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: preview
          stack-name: dev
          upsert: "true"
          pulumi-version: 3.150.0
          work-dir: ${{ runner.temp }}/pp-proj
          cloud-url: file://${{ runner.temp }}/pp-state
          policyPacks: ${{ runner.temp }}/does-not-exist-policy-pack
          policyPackConfigs: ${{ runner.temp }}/policy-config.json
      - name: Assert action failed due to missing policy pack
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent policy pack path"
            exit 1
          fi
          echo "PASS"
